# Agent identity — set at deploy time via: helm install --set agentId=<uuid>
agentId: ""

agent:
  name: sre-agent-comprehensive
  version: "1.0.0"
  vendor: "AgentCert"
  id: ""
  role: "remediation"
  notifyId: ""
  workflowUid: ""

  containerImage:
    registry: docker.io
    repository: agentcert/sre-agent-comprehensive
    tag: latest
    pullPolicy: IfNotPresent

  config:
    # --- LLM Configuration ---
    OPENAI_BASE_URL: "http://litellm.ace.svc.cluster.local:14000/v1"
    MODEL_ALIAS: "qwen2.5-32b-instruct"
    LANGFUSE_HOST: "http://langfuse-web.ace.svc.cluster.local:3000"

    # --- MCP Configuration ---
    # K8s and Prometheus MCP servers deployed alongside the app under test.
    # Override per-experiment via --set agent.config.MCP_URLS=...
    MCP_URLS: "http://kubernetes-mcp-server.otel-demo.svc.cluster.local:8081/mcp,http://prometheus-mcp-server.otel-demo.svc.cluster.local:8083/mcp"
    MCP_TIMEOUT: "30"

    # --- Agent behaviour ---
    SCAN_INTERVAL: "60"
    AGENT_MAX_RUNTIME_SECONDS: "0"
    AGENT_IDLE_AFTER_MAX_RUNTIME: "false"
    TARGET_NAMESPACE: "otel-demo"
    AGENT_SCOPE_NAMESPACE: "otel-demo"

    # Goal passed to the agent at startup (read as AGENT_GOAL env var)
    # Sampling temperature and tool-loop step budget (the agent's own defaults).
    SRE_AGENT_TEMPERATURE: "0.2"
    SRE_AGENT_MAX_STEPS: "40"

    AGENT_GOAL: "Diagnose and remediate all active faults in the Kubernetes cluster. Identify every affected resource, determine root causes, apply remediations, and verify that all services return to a healthy state."

  secret:
    OPENAI_API_KEY: "sk-agentcert-2026"
    LANGFUSE_PUBLIC_KEY: ""
    LANGFUSE_SECRET_KEY: ""

# ── agent-sidecar: transparent metadata-injection proxy ──────────────
# When enabled, a lightweight sidecar container intercepts agent→LiteLLM
# requests, injects experiment context (EXPERIMENT_ID, EXPERIMENT_RUN_ID,
# WORKFLOW_NAME) into the metadata field, and forwards to upstream.
# The agent has ZERO awareness of experiment context.
sidecar:
  enabled: true
  name: agent-sidecar
  image:
    registry: docker.io
    repository: agentcert/agent-sidecar
    tag: latest
    # IfNotPresent, not Always: setup builds this image from agent-sidecar/ and
    # side-loads it into the cluster. Always would silently swap it for whatever
    # Docker Hub's floating :latest is (possibly without CURRENT_FAULT_NAME
    # stamping) and break offline runs.
    pullPolicy: IfNotPresent
  port: 4001
  # The real LiteLLM proxy URL — sidecar forwards enriched requests here
  upstream: "http://litellm.ace.svc.cluster.local:14000"
  # Injection mode: "openai-metadata" | "http-header" | "none"
  injectionMode: "openai-metadata"
  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"

resources:
  limits:
    cpu: "500m"
    memory: "1.5Gi"     # Bumped from 512Mi — agent needs more for LLM tool-call chains

rbac:
  cluster:
    create: true
    rules:
      # Read access to pods and logs
      - apiGroups: [""]
        resources: ["pods", "pods/log", "pods/status", "events"]
        verbs: ["get", "list", "watch"]
      # Read access to higher-level resources
      - apiGroups: ["apps"]
        resources: ["deployments", "replicasets", "statefulsets"]
        verbs: ["get", "list", "watch"]

# ── Experiment builder settings ──────────────────────────────────────
# The values above that the ACE experiment builder lets a user change when
# this agent is added to an experiment. Each key is a path in this file and
# the value found there is the setting's default. No template reads this
# block, so Helm ignores it. Values the platform writes on every install
# (identity, MCP wiring, tracing, the sidecar, the agent mode) and secrets
# cannot be listed: the server rejects them (AgentCert pkg/chartconfig).
configurations:
  - key: agent.config.MODEL_ALIAS
    label: LLM model
    description: The model the agent reasons with. Leave it on the platform default unless you are comparing models.
    type: model
    group: LLM
  - key: agent.config.SRE_AGENT_TEMPERATURE
    label: Temperature
    type: number
    min: 0
    max: 2
    group: LLM
    advanced: true
  - key: agent.config.AGENT_GOAL
    label: Goal
    description: The task the agent is given at startup.
    type: text
    required: true
    group: Behaviour
  - key: agent.config.SCAN_INTERVAL
    label: Scan interval (seconds)
    description: Time between scans. The agent keeps scanning until the experiment ends.
    type: integer
    min: 1
    group: Behaviour
  - key: agent.config.SRE_AGENT_MAX_STEPS
    label: Max tool steps per scan
    type: integer
    min: 1
    max: 200
    group: Behaviour
    advanced: true
  - key: agent.config.MCP_TIMEOUT
    label: MCP tool timeout (seconds)
    type: integer
    min: 1
    group: Behaviour
    advanced: true
  - key: resources.limits.cpu
    label: CPU limit
    type: string
    pattern: "^[0-9]+([.][0-9]+)?m?$"
    group: Resources
    advanced: true
  - key: resources.limits.memory
    label: Memory limit
    type: string
    pattern: "^[1-9][0-9]*([.][0-9]+)?(Mi|Gi)$"
    group: Resources
    advanced: true
