apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agent.name }}-metadata
  labels:
    app.kubernetes.io/name: {{ .Values.agent.name }}
    agentcert.io/managed: "true"
    agentcert.io/version: {{ .Values.agent.version | quote }}
  annotations:
    agentcert.io/vendor: {{ .Values.agent.vendor | quote }}
data:
  # Agent Identity (used by sidecar for tracing)
  AGENT_NAME: {{ .Values.agent.name | quote }}
  AGENT_ID: {{ .Values.agent.id | default "" | quote }}
  AGENT_ROLE: {{ .Values.agent.role | default "observer" | quote }}
  AGENT_VERSION: {{ .Values.agent.version | quote }}
  
  # Experiment Correlation (links Langfuse traces to ChaosCenter experiments)
  # NOTIFY_ID = ChaosCenter's experiment_run_id (used as Langfuse trace_id)
  #             Falls back to workflow name if ChaosCenter doesn't provide one
  # WORKFLOW_NAME = Human-readable experiment name (for display/search)
  # WORKFLOW_UID = K8s-generated UUID (for unique identification if needed)
  NOTIFY_ID: {{ .Values.agent.config.NOTIFY_ID | default .Values.agent.notifyId | default "" | quote }}
  EXPERIMENT_ID: {{ .Values.agent.config.EXPERIMENT_ID | default "" | quote }}
  EXPERIMENT_RUN_ID: {{ .Values.agent.config.EXPERIMENT_RUN_ID | default "" | quote }}
  WORKFLOW_NAME: {{ .Values.agent.config.WORKFLOW_NAME | default .Values.agent.notifyId | default "" | quote }}
  WORKFLOW_UID: {{ .Values.agent.config.WORKFLOW_UID | default .Values.agent.workflowUid | default "" | quote }}

  # LLM Configuration
  # When sidecar is enabled, route through sidecar for metadata injection
  {{- if .Values.sidecar.enabled }}
  OPENAI_BASE_URL: "http://localhost:{{ .Values.sidecar.port }}/v1"
  {{- else }}
  OPENAI_BASE_URL: {{ .Values.agent.config.OPENAI_BASE_URL | quote }}
  {{- end }}
  MODEL_ALIAS: {{ .Values.agent.config.MODEL_ALIAS | quote }}
  LANGFUSE_HOST: {{ .Values.agent.config.LANGFUSE_HOST | default "" | quote }}
  {{- if .Values.agent.config.AZURE_API_VERSION }}
  AZURE_API_VERSION: {{ .Values.agent.config.AZURE_API_VERSION | quote }}
  {{- end }}

  # MCP Configuration
  MCP_URLS: {{ .Values.agent.config.MCP_URLS | quote }}
  {{- if .Values.agent.config.MCP_TIMEOUT }}
  MCP_TIMEOUT: {{ .Values.agent.config.MCP_TIMEOUT | quote }}
  {{- end }}

  # Scan Configuration
  {{- if .Values.agent.config.SCAN_INTERVAL }}
  SCAN_INTERVAL: {{ .Values.agent.config.SCAN_INTERVAL | quote }}
  {{- end }}
  {{- if .Values.agent.config.SCAN_QUERY }}
  SCAN_QUERY: {{ .Values.agent.config.SCAN_QUERY | quote }}
  {{- end }}
  TARGET_NAMESPACE: {{ .Values.agent.config.TARGET_NAMESPACE | default .Values.agent.config.AGENT_SCOPE_NAMESPACE | default "" | quote }}
  AGENT_MAX_RUNTIME_SECONDS: {{ .Values.agent.config.AGENT_MAX_RUNTIME_SECONDS | default "780" | quote }}
  AGENT_IDLE_AFTER_MAX_RUNTIME: {{ .Values.agent.config.AGENT_IDLE_AFTER_MAX_RUNTIME | default "true" | quote }}

  # Agent goal — injected as AGENT_GOAL env var into the agent container
  {{- if .Values.agent.config.AGENT_GOAL }}
  AGENT_GOAL: {{ .Values.agent.config.AGENT_GOAL | quote }}
  {{- end }}
