apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.agent.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.agent.name }}
    spec:
      serviceAccountName: {{ .Values.agent.name }}-sa
      containers:
        - name: agent
          image: "{{ .Values.agent.containerImage.registry }}/{{ .Values.agent.containerImage.repository }}:{{ .Values.agent.containerImage.tag }}"
          imagePullPolicy: {{ .Values.agent.containerImage.pullPolicy | default "Always" }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          env:
            # Agent identity
            - name: AGENT_NAME
              value: {{ .Values.agent.name | quote }}

            # Experiment correlation for agent-emitted tool observations.
            - name: NOTIFY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: NOTIFY_ID
            - name: EXPERIMENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: EXPERIMENT_ID
            - name: EXPERIMENT_RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: EXPERIMENT_RUN_ID
            - name: WORKFLOW_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: WORKFLOW_NAME
            - name: WORKFLOW_UID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: WORKFLOW_UID

            # LLM Configuration (required)
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: OPENAI_BASE_URL

            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.name }}-secret
                  key: OPENAI_API_KEY
                  optional: true

            - name: MODEL_ALIAS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: MODEL_ALIAS

            - name: LANGFUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: LANGFUSE_HOST
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.name }}-secret
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.name }}-secret
                  key: LANGFUSE_SECRET_KEY
                  optional: true

            {{- if .Values.agent.config.AZURE_API_VERSION }}
            - name: AZURE_API_VERSION
              value: {{ .Values.agent.config.AZURE_API_VERSION | quote }}
            {{- end }}

            # MCP Configuration (required)
            - name: MCP_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: MCP_URLS

            {{- if .Values.agent.config.MCP_TIMEOUT }}
            - name: MCP_TIMEOUT
              value: {{ .Values.agent.config.MCP_TIMEOUT | quote }}
            {{- end }}

            # Scan Configuration
            {{- if .Values.agent.config.SCAN_INTERVAL }}
            - name: SCAN_INTERVAL
              value: {{ .Values.agent.config.SCAN_INTERVAL | quote }}
            {{- end }}

            {{- if .Values.agent.config.SCAN_QUERY }}
            - name: SCAN_QUERY
              value: {{ .Values.agent.config.SCAN_QUERY | quote }}
            {{- end }}

            - name: TARGET_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: TARGET_NAMESPACE
            - name: AGENT_MAX_RUNTIME_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: AGENT_MAX_RUNTIME_SECONDS
            - name: AGENT_IDLE_AFTER_MAX_RUNTIME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: AGENT_IDLE_AFTER_MAX_RUNTIME

            # Scope override — when set, skips MCP scope auto-discovery and
            # forces the agent to operate within this namespace. Leave unset
            # to auto-discover from the MCP server itself.
            {{- if .Values.agent.config.AGENT_SCOPE_NAMESPACE }}
            - name: AGENT_SCOPE_NAMESPACE
              value: {{ .Values.agent.config.AGENT_SCOPE_NAMESPACE | quote }}
            {{- end }}

            # Agent goal — required by sre_comprehensive.__main__ (or set AGENT_GOAL env var)
            {{- if .Values.agent.config.AGENT_GOAL }}
            - name: AGENT_GOAL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.agent.name }}-metadata
                  key: AGENT_GOAL
            {{- end }}

{{- if .Values.sidecar.enabled }}
        # ── agent-sidecar: transparent metadata-injection proxy ──────
        - name: {{ .Values.sidecar.name }}
          image: "{{ .Values.sidecar.image.registry }}/{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy | default "Always" }}
          ports:
            - containerPort: {{ .Values.sidecar.port }}
              protocol: TCP
          env:
            - name: SIDECAR_PORT
              value: {{ .Values.sidecar.port | quote }}
            - name: UPSTREAM_URL
              value: {{ .Values.sidecar.upstream | quote }}
            - name: CONFIG_MOUNT
              value: "/etc/agent/metadata"
          volumeMounts:
            - name: agent-metadata
              mountPath: /etc/agent/metadata
              readOnly: true
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
{{- end }}
      volumes:
        - name: agent-metadata
          configMap:
            name: {{ .Values.agent.name }}-metadata
