apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.agent.name }}
  labels:
    app: {{ .Values.agent.name }}
    app.kubernetes.io/name: {{ .Values.agent.name }}
    agentcert.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.agent.name }}
      annotations:
        # Roll the pod whenever config changes so a re-run never reuses a stale
        # experiment id baked into the container env.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.agent.name }}-sa
      containers:
        - name: agent
          image: "{{ .Values.agent.containerImage.registry }}/{{ .Values.agent.containerImage.repository }}:{{ .Values.agent.containerImage.tag }}"
          imagePullPolicy: {{ .Values.agent.containerImage.pullPolicy | default "IfNotPresent" }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # envFrom instead of a hand-maintained env list: the control plane
          # injects ~40 --set agent.config.* values at experiment-save time and
          # this chart must not need editing to carry any of them.
          envFrom:
            - configMapRef:
                name: {{ .Values.agent.name }}-metadata
            - secretRef:
                name: {{ .Values.agent.name }}-secret
                optional: true
          {{- with .Values.agent.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: agent-metadata
              mountPath: /etc/agent/metadata
              readOnly: true
{{- if .Values.sidecar.enabled }}
        # ── agent-sidecar: transparent metadata-injection proxy ──────────────
        - name: {{ .Values.sidecar.name }}
          image: "{{ .Values.sidecar.image.registry }}/{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.sidecar.port }}
              protocol: TCP
          env:
            - name: SIDECAR_PORT
              value: {{ .Values.sidecar.port | quote }}
            - name: UPSTREAM_URL
              value: {{ .Values.sidecar.upstream | quote }}
            - name: INJECTION_MODE
              value: {{ .Values.sidecar.injectionMode | quote }}
            - name: CONFIG_MOUNT
              value: "/etc/agent/metadata"
          volumeMounts:
            - name: agent-metadata
              mountPath: /etc/agent/metadata
              readOnly: true
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
{{- end }}
      volumes:
        - name: agent-metadata
          configMap:
            name: {{ .Values.agent.name }}-metadata
