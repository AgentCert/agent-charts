{{/*
Keys this template writes explicitly. They are skipped by the generic range
below so a value injected as --set agent.config.<KEY> cannot produce a
duplicate ConfigMap entry.
*/}}
{{- $reserved := list "OPENAI_BASE_URL" "AGENT_NAME" "AGENT_ID" "AGENT_ROLE" "AGENT_VERSION" "NOTIFY_ID" "SESSION_ID" "WORKFLOW_NAME" "WORKFLOW_UID" "CURRENT_FAULT_NAME" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agent.name }}-metadata
  labels:
    app.kubernetes.io/name: {{ .Values.agent.name }}
    agentcert.io/managed: "true"
    agentcert.io/version: {{ .Values.agent.version | quote }}
  annotations:
    agentcert.io/vendor: {{ .Values.agent.vendor | quote }}
data:
  # ── Sidecar context keys ───────────────────────────────────────────────────
  # agent-sidecar mounts this ConfigMap at /etc/agent/metadata and reads each
  # key as a FILE on every request, so a long-running pod always stamps the
  # current experiment's IDs. Keep this set in sync with _CONTEXT_KEYS in
  # agent-sidecar/proxy.py — a missing key is silently dropped from the trace.
  AGENT_NAME: {{ .Values.agent.name | quote }}
  AGENT_ID: {{ .Values.agent.config.AGENT_ID | default .Values.agent.id | default .Values.agentId | default "" | quote }}
  AGENT_ROLE: {{ .Values.agent.role | default "observer" | quote }}
  AGENT_VERSION: {{ .Values.agent.version | quote }}

  # NOTIFY_ID becomes the Langfuse trace_id and the certifier's trace search key.
  NOTIFY_ID: {{ .Values.agent.config.NOTIFY_ID | default .Values.agent.notifyId | default "" | quote }}
  SESSION_ID: {{ .Values.agent.config.SESSION_ID | default .Values.agent.sessionId | default "" | quote }}
  WORKFLOW_NAME: {{ .Values.agent.config.WORKFLOW_NAME | default .Values.agent.notifyId | default "" | quote }}
  WORKFLOW_UID: {{ .Values.agent.config.WORKFLOW_UID | default .Values.agent.workflowUid | default "" | quote }}

  # Empty at deploy time. The Argo fault step patches this key right before
  # injecting a fault and clears it on revert, which is what lets the
  # certifier's Phase 0 bucket a multi-fault trace on ground truth instead of
  # guessing from `fault: *` span presence.
  CURRENT_FAULT_NAME: ""

  # ── LLM endpoint ──────────────────────────────────────────────────────────
  {{- if .Values.sidecar.enabled }}
  OPENAI_BASE_URL: "http://localhost:{{ .Values.sidecar.port }}/v1"
  {{- else }}
  OPENAI_BASE_URL: {{ .Values.agent.config.OPENAI_BASE_URL | quote }}
  {{- end }}

  # ── Everything else, verbatim ─────────────────────────────────────────────
  # Passing agent.config through untouched is what lets the control plane
  # inject keys this chart has never heard of without a template change.
  {{- range $key, $value := .Values.agent.config }}
  {{- if not (has $key $reserved) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
