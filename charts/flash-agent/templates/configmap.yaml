{{- $reserved := list "OPENAI_BASE_URL" "AGENT_NAME" "AGENT_ID" "AGENT_ROLE" "AGENT_VERSION" "NOTIFY_ID" "SESSION_ID" "WORKFLOW_NAME" "WORKFLOW_UID" "CURRENT_FAULT_NAME" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agent.name }}-metadata
  labels:
    app.kubernetes.io/name: {{ .Values.agent.name }}
    agentcert.io/managed: "true"
    agentcert.io/version: {{ .Values.agent.version | quote }}
  annotations:
    agentcert.io/vendor: {{ .Values.agent.vendor | quote }}
data:
  # Agent Identity (used by sidecar for tracing)
  AGENT_NAME: {{ .Values.agent.name | quote }}
  AGENT_ID: {{ .Values.agent.config.AGENT_ID | default .Values.agentId | default .Values.agent.id | default "" | quote }}
  AGENT_ROLE: {{ .Values.agent.role | default "observer" | quote }}
  AGENT_VERSION: {{ .Values.agent.version | quote }}
  
  # Experiment Correlation (links Langfuse traces to ChaosCenter experiments)
  # NOTIFY_ID = ChaosCenter's experiment_run_id (used as Langfuse trace_id)
  #             Falls back to workflow name if ChaosCenter doesn't provide one
  # WORKFLOW_NAME = Human-readable experiment name (for display/search)
  # WORKFLOW_UID = K8s-generated UUID (for unique identification if needed)
  NOTIFY_ID: {{ .Values.agent.config.NOTIFY_ID | default .Values.agent.notifyId | default "" | quote }}
  WORKFLOW_NAME: {{ .Values.agent.config.WORKFLOW_NAME | default .Values.agent.notifyId | default "" | quote }}
  WORKFLOW_UID: {{ .Values.agent.config.WORKFLOW_UID | default .Values.agent.workflowUid | default "" | quote }}
  # CURRENT_FAULT_NAME starts empty at deploy time. The Argo workflow's
  # fault-injection step patches this same ConfigMap (`kubectl patch
  # configmap {{ .Values.agent.name }}-metadata --type merge`) right before
  # injecting a fault and clears it right after revert, so the sidecar can
  # stamp each LLM call with the fault window it actually fell in. See
  # agent-sidecar/proxy.py and certifier/fault_analyzer's Phase 0 bucketing.
  CURRENT_FAULT_NAME: ""

  # LLM Configuration
  # When sidecar is enabled, route through sidecar for metadata injection
  {{- if .Values.sidecar.enabled }}
  OPENAI_BASE_URL: "http://localhost:{{ .Values.sidecar.port }}/v1"
  {{- else }}
  OPENAI_BASE_URL: {{ .Values.agent.config.OPENAI_BASE_URL | quote }}
  {{- end }}
  # Everything else, verbatim. The control plane injects ~40 --set
  # agent.config.* values per run (AGENT_MODE, MITIGATION_*, TARGET_NAMESPACE,
  # EXPERIMENT_ID, LANGFUSE_*, ...); enumerating keys here silently dropped
  # every one this chart had not been taught about.
  {{- range $key, $value := .Values.agent.config }}
  {{- if not (has $key $reserved) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
